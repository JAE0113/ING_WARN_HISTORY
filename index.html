<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잉스코드 Report</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="box">
    <h1>잉스코드 Report</h1>

    <input id="reporter" type="text" placeholder="신고자" />
    <input id="target" type="text" placeholder="신고 대상자" />
    <textarea id="reason" placeholder="사유를 입력하세요"></textarea>

    <input id="photo" type="file" accept="image/*" />

    <button id="submitBtn" onclick="submitReport()">전송</button>
    <p id="loadingText" style="display:none;">전송 중입니다...</p>
  </main>

  <div class="toast-container">
    <div id="toast" class="toast">
      <div class="toast-header">
        <strong class="toast-title">알림</strong>
        <button type="button" class="toast-close" onclick="closeToast()">&times;</button>
      </div>
      <div class="toast-body" id="toast-message"></div>
    </div>
  </div>

  <script src="./app.js?v=9"></script>
</body>
</html>
